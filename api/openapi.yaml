openapi: 3.0.3
info:
  description: Fetch social media feeds
  title: Fetcher API
  version: 1.2.0
servers:
  - description: Fetcher Host
    url: https://fetcher-ho4joes5va-uw.a.run.app/
paths:
  /feed:
    get:
      description: Get feed.
      operationId: getFeed
      parameters:
        - description: twitterID
          in: query
          name: twitterID
          required: false
          schema:
            format: int64
            type: integer
        - description: instagramID
          in: query
          name: instagramID
          required: false
          schema:
            format: int64
            type: integer
        - description: bloggerID
          in: query
          name: bloggerID
          required: false
          schema:
            type: string
        - description: soundcloudID
          in: query
          name: soundcloudID
          required: false
          schema:
            type: string
        - description: swarmID
          in: query
          name: swarmID
          required: false
          schema:
            type: string
        - description: deviantartID
          in: query
          name: deviantartID
          required: false
          schema:
            type: string
        - description: untappdID
          in: query
          name: untappdID
          required: false
          schema:
            type: string
        - description: blueskyID
          in: query
          name: blueskyID
          required: false
          schema:
            type: string
        - description: youtubeID
          in: query
          name: youtubeID
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/feedItems"
          description: feed item array response
      summary: Get feed
  /proxy:
    get:
      summary: Proxy url
      description: Proxy url.
      operationId: proxy
      parameters:
        - description: url
          in: query
          name: url
          required: false
          schema:
            format: url
            type: string
      responses:
        "200":
          description: the proxied url content
components:
  schemas:
    feedItems:
      example:
        items:
          - id: CAfj92js93gjai
            ts: 1560834652
            source: instagram
          - id: hnoy78d34qdty3
            ts: 1560802637
            source: twitter
      properties:
        items:
          items:
            $ref: "#/components/schemas/feedItem"
          type: array
      required:
        - items
      type: object
    feedItem:
      example:
        id: hnoy78d34qdty3
        ts: 1560802637
        source: twitter
      properties:
        id:
          description: Unique identifier for a feed item
          type: string
        ts:
          description: Unix timestamp (seconds) for when the item was published
          format: int64
          type: integer
        source:
          description: The source platform the item is from
          enum:
            - twitter
            - instagram
            - blogger
            - soundcloud
            - swarm
            - deviantart
            - untappd
            - bluesky
            - youtube
          type: string
        url:
          description: Permalink to the feed item on the platform
          type: string
        author:
          $ref: "#/components/schemas/feedItem_author"
        media:
          description: Array of media items (images, videos, etc...)
          items:
            $ref: "#/components/schemas/feedItem_media"
          type: array
        content:
          description: Text content for the item (may contain HTML)
          type: string
      required:
        - id
        - source
        - ts
      type: object
    feedItem_author:
      description: Author of the feed item (poster, uploader, or originator in reposts/quotes)
      properties:
        handle:
          description: Username or handle on the platform
          type: string
        name:
          description: Display name of the author
          type: string
        avatar:
          description: URL to the author's avatar image
          type: string
        url:
          description: URL to the author's profile on the platform
          type: string
      type: object
    feedItem_media:
      properties:
        url:
          description: The URL to the media content
          type: string
        poster:
          description: The URL to a poster image
          type: string
        kind:
          description: The kind of media
          enum:
            - image
            - video
            - audio
          type: string
      required:
        - kind
        - url
